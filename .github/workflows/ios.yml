# Compila o app do iPhone num Mac do GitHub (grátis em repositório público),
# abre no simulador e guarda as capturas de tela como artefato da rodada.
name: iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enviar_para_apple:
        description: "Enviar para o TestFlight / App Store Connect"
        type: boolean
        default: false
      atualizar_ficha:
        description: "Atualizar a ficha da loja (textos e capturas)"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # para publicar as capturas no ramo "capturas"

jobs:
  simulador:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Lidos pela tarefa que gera Configuracao.kt. Sem eles, o app compila com
      # os valores de exemplo e só não conecta no Supabase.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache do Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Escolher o simulador
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          dados = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in dados if "iOS" in k), reverse=True)
          for versao in ios:
              for d in dados[versao]:
                  if d["name"].startswith("iPhone") and "Pro Max" in d["name"]:
                      print(d["udid"]); sys.exit()
          for versao in ios:
              for d in dados[versao]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "Simulador: $UDID"
          xcrun simctl list devices | grep "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Compilar o código Kotlin para o simulador
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Gerar o projeto do Xcode
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar o app
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee ../xcodebuild.log | grep -E "error:|warning: .*swift|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug-iphonesimulator/NatacaoCriativa.app

      - name: Abrir no simulador e fotografar
        run: |
          mkdir -p capturas
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" iosApp/build/Build/Products/Debug-iphonesimulator/NatacaoCriativa.app
          # A saída do app (inclui a mensagem de qualquer erro do Kotlin).
          xcrun simctl launch --stdout="$PWD/capturas/saida-do-app.txt" --stderr="$PWD/capturas/saida-do-app.txt" "$UDID" com.natacaocriativa.treinos
          sleep 8
          xcrun simctl io "$UDID" screenshot capturas/01-abertura.png
          sleep 15
          xcrun simctl io "$UDID" screenshot capturas/02-entrar.png
          # O app ainda está vivo? Se fechou sozinho, é travamento.
          xcrun simctl spawn "$UDID" launchctl list | grep -i natacao || echo "APP NÃO ESTÁ RODANDO"
          # O link de treino compartilhado também precisa abrir o app.
          xcrun simctl openurl "$UDID" "natacaocriativa://treino/TESTE1"
          sleep 5
          xcrun simctl io "$UDID" screenshot capturas/03-link-de-treino.png
          # O registro do sistema é guardado agora, antes do roteiro digitar o login.
          xcrun simctl spawn "$UDID" log show --last 5m --style compact             --predicate 'process == "NatacaoCriativa"' > capturas/registro-do-app.txt 2>&1 || true

      # Entra com a conta de teste e fotografa cada tela (iosAppUITests).
      # O registro deste passo fica só na tela da rodada, onde o GitHub esconde os
      # segredos; ele NÃO vai para arquivo, porque o Xcode anota o texto digitado.
      - name: Percorrer as telas
        continue-on-error: true
        working-directory: iosApp
        env:
          TEST_RUNNER_TESTE_EMAIL: ${{ secrets.TESTE_EMAIL }}
          TEST_RUNNER_TESTE_SENHA: ${{ secrets.TESTE_SENHA }}
        run: |
          set -o pipefail
          export TEST_RUNNER_CAPTURAS_DIR="$GITHUB_WORKSPACE/capturas"
          xcodebuild test             -project iosApp.xcodeproj             -scheme iosApp             -configuration Debug             -destination "id=$UDID"             -derivedDataPath build             2>&1 | grep -E "error:|Test Case|Executed|Não achei|Não chegou|não abriu|TEST (SUCCEEDED|FAILED)|Testing failed"             | tee "$GITHUB_WORKSPACE/capturas/roteiro.txt"

      - name: Registro do app
        if: always()
        run: |
          # Só se o app falhou antes de fotografar (depois disso o roteiro digitou o login).
          [ -f capturas/registro-do-app.txt ] || xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "NatacaoCriativa"' > capturas/registro-do-app.txt 2>&1 || true
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i natacao \
            && cp ~/Library/Logs/DiagnosticReports/*atacao* capturas/ || true
          echo "--- saída do app ---"; cat capturas/saida-do-app.txt || true

      # As capturas também vão para o ramo "capturas", que se baixa sem login.
      - name: Publicar as capturas no ramo capturas
        if: always()
        env:
          TESTE_EMAIL: ${{ secrets.TESTE_EMAIL }}
          TESTE_SENHA: ${{ secrets.TESTE_SENHA }}
        run: |
          cp xcodebuild.log capturas/ 2>/dev/null || true
          # Trava de segurança: o ramo é público, o e-mail de teste não pode ir junto.
          if [ -n "$TESTE_EMAIL" ]; then
            grep -rlF "$TESTE_EMAIL" capturas | xargs -r perl -pi -e 's/\Q$ENV{TESTE_EMAIL}\E/<e-mail de teste>/gi' || true
            ! grep -rqiF "$TESTE_EMAIL" capturas
          fi
          if [ -n "$TESTE_SENHA" ]; then
            grep -rlF "$TESTE_SENHA" capturas | xargs -r perl -pi -e 's/\Q$ENV{TESTE_SENHA}\E/<senha>/g' || true
            ! grep -rqF "$TESTE_SENHA" capturas
          fi
          cd capturas
          git init -q -b capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas da rodada ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas

  # O app para um iPhone de verdade, sem assinatura. Serve para instalar pelo
  # Sideloadly (assinado com o Apple ID de quem instala). Vai para o ramo "ipa".
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache do Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Gerar o projeto do Xcode
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar para iPhone (Release, sem assinatura)
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/NatacaoCriativa.app

      - name: Empacotar o .ipa
        run: |
          mkdir -p saida/Payload
          cp -R iosApp/build/Build/Products/Release-iphoneos/NatacaoCriativa.app saida/Payload/
          cd saida && zip -qry NatacaoCriativa.ipa Payload && rm -rf Payload
          ls -la
          printf 'Rodada %s, commit %s\n' "${{ github.run_number }}" "${{ github.sha }}" > LEIA.txt

      - name: Publicar no ramo ipa
        run: |
          cd saida
          git init -q -b ipa
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "App para iPhone, rodada ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ipa

  # Assina e envia para o App Store Connect (TestFlight). Só roda quando pedido
  # pelo botão "Run workflow" com "Enviar para o TestFlight" marcado.
  # Segredos (cadastrados pela Nice em Settings > Secrets > Actions):
  #   APPLE_TEAM_ID       Team ID da conta Apple Developer (10 letras/números)
  #   APPSTORE_KEY_ID     Key ID da chave de API do App Store Connect
  #   APPSTORE_ISSUER_ID  Issuer ID, na mesma página das chaves
  #   APPSTORE_KEY_P8     conteúdo inteiro do arquivo AuthKey_XXXX.p8
  # A chave precisa do papel "Admin": é ela que deixa a Apple gerar o
  # certificado e o perfil de distribuição na nuvem, sem Mac.
  apple:
    # Pelo botão Run workflow, ou por um commit com a marca de envio na mensagem.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.enviar_para_apple) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[apple]'))
    # A Apple só aceita envio de app compilado com o Xcode 26 (SDK do iOS 26) ou mais novo.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir os segredos da Apple
        run: |
          falta=""
          for s in APPLE_TEAM_ID APPSTORE_KEY_ID APPSTORE_ISSUER_ID; do
            [ -n "${!s}" ] || falta="$falta $s"
          done
          [ -n "${{ secrets.APPSTORE_KEY_P8 }}" ] || falta="$falta APPSTORE_KEY_P8"
          if [ -n "$falta" ]; then echo "Faltam os segredos:$falta"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache do Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Gerar o projeto do Xcode
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Chave de API da Apple
        run: |
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "${{ secrets.APPSTORE_KEY_P8 }}" > "$RUNNER_TEMP/apple/AuthKey.p8"
          echo "CHAVE_P8=$RUNNER_TEMP/apple/AuthKey.p8" >> "$GITHUB_ENV"

      # Sem assinatura aqui: assinar no arquivamento pede um perfil de
      # desenvolvimento, que exige um iPhone cadastrado na conta. Quem assina é
      # o passo de envio, com o perfil de distribuição da App Store.
      - name: Arquivar (Release, sem assinatura)
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild archive             -project iosApp.xcodeproj             -scheme iosApp             -configuration Release             -destination "generic/platform=iOS"             -archivePath "$RUNNER_TEMP/NatacaoCriativa.xcarchive"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             CURRENT_PROJECT_VERSION="${{ github.run_number }}"             2>&1 | tee "$RUNNER_TEMP/arquivo.log" | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/arquivo.log" || { tail -40 "$RUNNER_TEMP/arquivo.log"; exit 1; }
          xcodebuild -version
          test -d "$RUNNER_TEMP/NatacaoCriativa.xcarchive"

      - name: Enviar para o App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive             -archivePath "$RUNNER_TEMP/NatacaoCriativa.xcarchive"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -exportPath "$RUNNER_TEMP/saida"             -allowProvisioningUpdates             -authenticationKeyPath "$CHAVE_P8"             -authenticationKeyID "$APPSTORE_KEY_ID"             -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"             2>&1 | tee "$RUNNER_TEMP/envio.log" | grep -E "error:|Upload|EXPORT (SUCCEEDED|FAILED)|Progress|Validation|SDK" || true
          # O grep acima esconde o código de saída: conferir o resultado pelo registro.
          if grep -qE "Validation failed|Upload failed|error: exportArchive|EXPORT FAILED" "$RUNNER_TEMP/envio.log"; then
            echo "A Apple recusou o envio."; exit 1
          fi
          grep -qE "Upload succeeded|EXPORT SUCCEEDED" "$RUNNER_TEMP/envio.log" || { echo "Sem confirmação de envio."; exit 1; }
          echo "Versão enviada: 1.0 (${{ github.run_number }}). Aparece no TestFlight depois do processamento da Apple (10 a 30 min)."

      - name: Apagar a chave
        if: always()
        run: rm -rf "$RUNNER_TEMP/apple"

  # Envia os textos e as capturas da ficha da App Store (iosApp/fastlane) com a
  # mesma chave de API. Não envia binário nem manda para revisão.
  ficha:
    # Pelo botão Run workflow, ou por um commit com [ficha] na mensagem.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.atualizar_ficha) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[ficha]'))
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Chave de API da Apple
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple"
          python3 - <<'PY'
          import json, os
          json.dump({"key_id": os.environ["KEY_ID"], "issuer_id": os.environ["ISSUER_ID"],
                     "key": os.environ["KEY_P8"], "in_house": False},
                    open(os.path.join(os.environ["RUNNER_TEMP"], "apple", "chave.json"), "w"))
          PY

      - name: Enviar a ficha
        working-directory: iosApp
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          fastlane --version | tail -1
          fastlane deliver             --api_key_path "$RUNNER_TEMP/apple/chave.json"             --app_identifier com.natacaocriativa.treinos             --app_version 1.0             --metadata_path fastlane/metadata             --screenshots_path fastlane/screenshots             --skip_binary_upload true             --overwrite_screenshots true             --submit_for_review false             --run_precheck_before_submit false             --precheck_include_in_app_purchases false             --force true

      - name: Apagar a chave
        if: always()
        run: rm -rf "$RUNNER_TEMP/apple"
